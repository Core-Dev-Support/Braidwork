[package]
name = "braidwork-core"
# Обязана совпадать с тегом релиза без ведущей `v`.
#
# Ядро объявляет эту версию на карточке устройства, и пользователь читает её
# там. Долго стояла `0.1.0` при релизе v0.9.3, и карточка показывала `0.1.0`
# вместо `0.9.3`, а в примечаниях к релизу было написано обратное. Никто этого
# не заметил: сборка зелёная, значение настоящее, просто не то.
#
# Поэтому проверка на CI, а не договорённость: см. шаг «Версия ядра совпадает с
# тегом» в `.github/workflows/core.yml`. Тег одно место истины, Cargo.toml
# следует за ним.
version = "0.9.25"
edition = "2021"
rust-version = "1.75"
description = "Braidwork core: device identity, family trust, encrypted sessions, multi-transport, no server"
license = "Apache-2.0"
repository = "https://github.com/Core-Dev-Support/Braidwork"

[lib]
name = "braidwork_core"
# cdylib — для вызова из Android (JNI), HarmonyOS (NAPI), Windows (P/Invoke), Linux (C-FFI).
# rlib — для встроенного использования ядра в тестах и в десктопном демоне.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Криптография. Noise XX и ed25519 — готовые реализации, а не самодельный обмен ключами.
# Фича rand_core обязательна: генерация ключей идёт из того же OsRng, что и подпись,
# иначе типы ключей не сойдутся.
snow = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
blake3 = "1"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }

# Сериализация. Protobuf для всех сообщений, включая BLE. Решение D-003.
prost = "0.13"

thiserror = "1"

# Мост к JVM нужен только Android-клиенту. Отдельная библиотека для него была
# источником ошибок загрузки: см. комментарий в src/jni_bridge.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
prost-build = "0.13"

[features]
default = ["transport-lan", "transport-ble", "transport-ice", "transport-usb", "transport-softap"]
# Каналы — включаемые по умолчанию, но каждый можно отключить у конкретного клиента.
# Клиент без интерфейса и без BLE не должен тащить их в сборку.
transport-lan = []
transport-ble = []
transport-usb = []
transport-softap = []
# ICE-канал нужен только для связи между разными сетками. Тянет tokio и stun.
transport-ice = ["dep:stun", "dep:tokio"]
# Экранный поток тянет кодировщики. Включается только клиентами, которым они нужны.
media = ["dep:tokio"]

[dependencies.stun]
version = "0.2"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"]
optional = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# panic = "abort" недопустим (D-008): ядро грузится в процесс чужого клиента, и abort
# убил бы его без перехвата. С unwind catch_unwind на границе C ABI работает.
# Плата — около 10-15% размера cdylib.
panic = "unwind"
strip = true

# Профиль для десктопного демона: важна скорость, размер вторичен.
# Unwind наследуется, снятие недопустимо и здесь: демон переживает панику.
[profile.release-fast]
inherits = "release"
opt-level = 3