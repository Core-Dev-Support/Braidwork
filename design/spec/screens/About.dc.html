<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>О приложении</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:980px;position:relative;overflow:hidden;box-sizing:border-box;background:linear-gradient(180deg,#E3EAF4 0,#F1F2F6 360px);font-family:Onest,system-ui,sans-serif;color:#121316">

  <div style="padding:56px 12px 0 12px">
    <a href="Settings.dc.html" aria-label="Назад" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#121316">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.back}}"/></svg>
    </a>
  </div>
  <h1 style="margin:4px 24px 0 24px;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">О приложении</h1>

  <div style="margin:24px 16px 0 16px;display:flex;flex-direction:column;align-items:center;text-align:center">
    <div style="width:88px;height:88px;border-radius:26px;background:#2B8CF5;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.sync}}"/></svg>
    </div>
    <div style="margin-top:12px;font-size:24px;line-height:30px;font-weight:700">FamSync</div>
    <div style="margin-top:2px;font-size:14px;line-height:20px;color:#666A75">Версия 0.1.0 · ядро 0.1.0-step0</div>
  </div>

  <div style="margin:24px 16px 0 16px">
    <div style="padding:0 8px 8px 8px;font-size:13px;line-height:17px;font-weight:500;color:#666A75">Платформы</div>
    <div style="background:#FFFFFF;border-radius:24px;overflow:hidden">
      <sc-for list="{{platforms}}" as="r" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:64px;box-sizing:border-box;border-top:{{r.border}}">
          <div style="width:40px;height:40px;border-radius:12px;background:{{r.bg}};color:{{r.fg}};display:flex;align-items:center;justify-content:center;flex:none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;line-height:22px;font-weight:500">{{r.title}}</div>
            <div style="font-size:13px;line-height:18px;color:#666A75">{{r.sub}}</div>
          </div>
          <div style="height:26px;padding:0 10px;border-radius:13px;background:#EEEEF1;color:#4A4D57;font-size:12px;font-weight:600;display:flex;align-items:center">{{r.step}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin:20px 16px 0 16px">
    <div style="padding:0 8px 8px 8px;font-size:13px;line-height:17px;font-weight:500;color:#666A75">Проект</div>
    <div style="background:#FFFFFF;border-radius:24px;overflow:hidden">
      <sc-for list="{{links}}" as="r" hint-placeholder-count="3">
        <a href="{{r.href}}" style="display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:56px;box-sizing:border-box;border-top:{{r.border}};color:#121316">
          <div style="flex:1;min-width:0;font-size:16px;line-height:22px;font-weight:500">{{r.title}}</div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ic.chev}}"/></svg>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      back: 'M15 6l-6 6 6 6',
      chev: 'M9 6l6 6-6 6',
      sync: 'M4 8h13l-3-3M20 16H7l3 3',
      phone: 'M8 3h8a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 16 21H8a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 8 3zM11 18h2',
      laptop: 'M6 5h12a2 2 0 0 1 2 2v9H4V7a2 2 0 0 1 2-2zM2 19h20',
      mirror: 'M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 17v3',
      tablet: 'M6 3h12a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 6 3zM11 18h2'
    };
    const blue = { bg: '#E4F1FF', fg: '#1A6FDB' };
    const green = { bg: '#E8F6EE', fg: '#16804A' };
    const purple = { bg: '#EFEAFB', fg: '#6038C9' };
    const orange = { bg: '#FFF1E6', fg: '#C65D0E' };
    const raw = [
      { d: I.phone, c: green, title: 'Android 6 и новее', sub: 'Kotlin', step: 'Шаг 3' },
      { d: I.mirror, c: blue, title: 'Windows', sub: 'WinUI 3', step: 'Шаг 5' },
      { d: I.laptop, c: orange, title: 'Linux', sub: 'AppImage, KDE и GNOME', step: 'Шаг 6' },
      { d: I.tablet, c: purple, title: 'HarmonyOS NEXT', sub: 'ArkTS и NAPI', step: 'Шаг 9' },
      { d: I.phone, c: green, title: 'Android 5', sub: 'minSdk 21', step: 'Шаг 10' }
    ];
    const platforms = raw.map(function (r, i) {
      return { d: r.d, bg: r.c.bg, fg: r.c.fg, title: r.title, sub: r.sub, step: r.step, border: i === 0 ? 'none' : '1px solid #F0F0F3' };
    });
    const links = [
      { title: 'Этапы разработки', href: 'Roadmap.dc.html' },
      { title: 'Лицензии', href: '#' },
      { title: 'Политика конфиденциальности', href: '#' }
    ].map(function (r, i) { return Object.assign({}, r, { border: i === 0 ? 'none' : '1px solid #F0F0F3' }); });
    return { ic: I, platforms: platforms, links: links };
  }
}
</script>
</body>
</html>
