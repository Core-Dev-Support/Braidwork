<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Устройства</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:linear-gradient(180deg,#3B4252 0,#2B2624 42%,#1B1716 100%);font-family:Onest,system-ui,sans-serif;color:#FFFFFF">

  <div style="padding:60px 24px 0 24px;display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1 style="margin:0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">Устройства семьи</h1>
      <div style="margin-top:4px;font-size:16px;line-height:22px;color:#C2C5CE">{{count}}</div>
    </div>
    <div style="display:flex;gap:2px;margin-top:-2px">
      <a href="Pair.dc.html" aria-label="Добавить устройство" style="width:44px;height:44px;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"/></svg>
      </a>
      <button type="button" aria-label="Ещё" style="width:44px;height:44px;border:0;background:transparent;color:#FFFFFF;padding:0;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.more}}"/></svg>
      </button>
    </div>
  </div>

  <div style="margin:18px 24px 0 24px;display:flex;gap:8px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{c.pick}}" style="height:40px;padding:0 16px;border:0;border-radius:20px;cursor:pointer;font-size:14px;font-weight:500;background:{{c.bg}};color:{{c.fg}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="margin:18px 24px 0 24px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
    <sc-for list="{{cards}}" as="d" hint-placeholder-count="6">
      <a href="DeviceDetail.dc.html" style="height:140px;box-sizing:border-box;padding:16px;border-radius:24px;background:{{d.bg}};color:{{d.nameColor}};display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <div style="font-size:16px;line-height:21px;font-weight:600">{{d.name}}</div>
          <div style="margin-top:4px;display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:{{d.statusColor}}">
            <span style="width:8px;height:8px;border-radius:50%;background:{{d.dot}};flex:none"></span>{{d.status}}
          </div>
        </div>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:{{d.iconOpacity}}"><path d="{{d.d}}"/></svg>
      </a>
    </sc-for>
  </div>

  <a href="Pair.dc.html" style="margin:12px 24px 0 24px;height:60px;box-sizing:border-box;border-radius:24px;border:1.5px dashed #6C707B;color:#E4E6EB;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"/></svg>
    Добавить устройство
  </a>

  <nav aria-label="Основное меню" style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 6px 22px 6px;display:flex;background:#141416;border-top:1px solid #2C2C31">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{n.color}};font-size:11px;line-height:14px;font-weight:{{n.w}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        {{n.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all' };
  }
  renderVals() {
    const I = {
      plus: 'M12 5v14M5 12h14',
      more: 'M5 12h.01M12 12h.01M19 12h.01',
      phone: 'M8 3h8a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 16 21H8a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 8 3zM11 18h2',
      laptop: 'M6 5h12a2 2 0 0 1 2 2v9H4V7a2 2 0 0 1 2-2zM2 19h20',
      tablet: 'M6 3h12a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 6 3zM11 18h2',
      mirror: 'M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 17v3',
      home: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',
      devices: 'M3 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9H3zM1 19h16M19 9h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z',
      sync: 'M4 8h13l-3-3M20 16H7l3 3',
      family: 'M6 8a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.7 6.2a2.6 2.6 0 0 1 0 5.2M17 14.2c2.4.6 4 2.6 4 5.3',
      settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
    };
    const self = this;
    const f = this.state.f;
    const all = [
      { name: 'Телефон Кости', status: 'Это устройство', kind: 'online', d: I.phone },
      { name: 'Ноутбук Linux', status: 'В сети · LAN', kind: 'online', d: I.laptop },
      { name: 'ПК с Windows', status: 'В сети · LAN', kind: 'online', d: I.mirror },
      { name: 'Планшет мамы', status: 'Через интернет', kind: 'online', d: I.tablet },
      { name: 'Huawei Mate', status: 'Рядом · BLE', kind: 'near', d: I.phone },
      { name: 'Старый Android 5', status: 'Офлайн', kind: 'off', d: I.phone }
    ];
    const dotColor = { online: '#3DDC84', near: '#5AA9FF', off: '#8A8D97' };
    const shown = all.filter(function (x) { return f === 'all' || x.kind === f; });
    const cards = shown.map(function (x) {
      const off = x.kind === 'off';
      return {
        name: x.name, status: x.status, d: x.d,
        dot: dotColor[x.kind],
        bg: off ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.12)',
        nameColor: off ? '#B4B7C0' : '#FFFFFF',
        statusColor: off ? '#A3A6B0' : '#D5D8DF',
        iconOpacity: off ? '0.45' : '0.85'
      };
    });
    const chips = [
      { id: 'all', label: 'Все' },
      { id: 'online', label: 'В сети' },
      { id: 'near', label: 'Рядом' },
      { id: 'off', label: 'Офлайн' }
    ].map(function (c) {
      const on = f === c.id;
      return { label: c.label, bg: on ? '#FFFFFF' : 'rgba(255,255,255,0.14)', fg: on ? '#121316' : '#FFFFFF', pick: function () { self.setState({ f: c.id }); } };
    });
    const nav = [
      { href: 'Main.dc.html', label: 'Главная', d: I.home },
      { href: 'Devices.dc.html', label: 'Устройства', d: I.devices },
      { href: 'Share.dc.html', label: 'Обмен', d: I.sync },
      { href: 'Family.dc.html', label: 'Семья', d: I.family },
      { href: 'Settings.dc.html', label: 'Настройки', d: I.settings }
    ].map(function (n, i) { return Object.assign({}, n, { color: i === 1 ? '#6DB2FF' : '#A7AAB4', w: i === 1 ? '600' : '500' }); });
    return { ic: I, chips: chips, cards: cards, nav: nav, count: shown.length + ' из 6 устройств' };
  }
}
</script>
</body>
</html>
