<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Семья</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:960px;position:relative;overflow:hidden;box-sizing:border-box;background:linear-gradient(180deg,#E3EAF4 0,#F1F2F6 360px);font-family:Onest,system-ui,sans-serif;color:#121316">

  <div style="padding:60px 24px 0 24px;display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1 style="margin:0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">Семья</h1>
      <div style="margin-top:4px;font-size:16px;line-height:22px;color:#666A75">Устройства связаны напрямую</div>
    </div>
    <a href="Pair.dc.html" aria-label="Пригласить" style="width:44px;height:44px;margin-top:-2px;color:#121316;display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"/></svg>
    </a>
  </div>

  <section style="margin:20px 16px 0 16px;background:#FFFFFF;border-radius:28px;padding:20px;box-shadow:0 1px 2px rgba(20,30,50,0.04)">
    <div style="display:flex;align-items:center">
      <sc-for list="{{avatars}}" as="a" hint-placeholder-count="4">
        <div style="width:52px;height:52px;border-radius:50%;margin-left:{{a.ml}};border:3px solid #FFFFFF;box-sizing:border-box;background:{{a.bg}};color:{{a.fg}};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600">{{a.letter}}</div>
      </sc-for>
    </div>
    <div style="margin-top:14px;font-size:22px;line-height:28px;font-weight:600">Семья Кости</div>
    <div style="margin-top:2px;font-size:14px;line-height:20px;color:#666A75">4 участника · 6 устройств</div>
    <a href="Pair.dc.html" style="margin-top:18px;height:52px;border-radius:26px;background:#1A6FDB;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.qr}}"/></svg>
      Пригласить по QR
    </a>
  </section>

  <div style="margin:22px 24px 0 24px;font-size:18px;line-height:24px;font-weight:600">Участники</div>
  <section style="margin:10px 16px 0 16px;background:#FFFFFF;border-radius:24px;overflow:hidden">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
      <a href="DeviceDetail.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:72px;box-sizing:border-box;border-top:{{m.border}};color:#121316">
        <div style="width:44px;height:44px;border-radius:50%;background:{{m.bg}};color:{{m.fg}};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none">{{m.letter}}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;line-height:22px;font-weight:500">{{m.name}}</div>
          <div style="font-size:13px;line-height:18px;color:#666A75">{{m.sub}}</div>
        </div>
        <div style="height:26px;padding:0 10px;border-radius:13px;background:{{m.tagBg}};color:{{m.tagFg}};font-size:12px;font-weight:600;display:flex;align-items:center">{{m.role}}</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ic.chev}}"/></svg>
      </a>
    </sc-for>
  </section>

  <div style="margin:22px 24px 0 24px;font-size:18px;line-height:24px;font-weight:600">Сеть семьи</div>
  <section style="margin:10px 16px 0 16px;background:#FFFFFF;border-radius:24px;overflow:hidden">
    <sc-for list="{{netrows}}" as="r" hint-placeholder-count="3">
      <a href="{{r.href}}" style="display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:64px;box-sizing:border-box;border-top:{{r.border}};color:#121316">
        <div style="width:40px;height:40px;border-radius:12px;background:{{r.bg}};color:{{r.fg}};display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;line-height:22px;font-weight:500">{{r.title}}</div>
          <div style="font-size:13px;line-height:18px;color:#666A75">{{r.sub}}</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ic.chev}}"/></svg>
      </a>
    </sc-for>
  </section>

  <nav aria-label="Основное меню" style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 6px 22px 6px;display:flex;background:#FFFFFF;border-top:1px solid #E8E9EE">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{n.color}};font-size:11px;line-height:14px;font-weight:{{n.w}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        {{n.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      plus: 'M12 5v14M5 12h14',
      chev: 'M9 6l6 6-6 6',
      qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3M20 14v2M14 20h3M20 20v0',
      refresh: 'M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4',
      globe: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18',
      key: 'M3 14a4 4 0 1 0 8 0a4 4 0 1 0-8 0M10.5 12l9.5-9M16 7l3 3M14 9l2 2',
      home: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',
      devices: 'M3 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9H3zM1 19h16M19 9h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z',
      sync: 'M4 8h13l-3-3M20 16H7l3 3',
      family: 'M6 8a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.7 6.2a2.6 2.6 0 0 1 0 5.2M17 14.2c2.4.6 4 2.6 4 5.3',
      settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
    };
    const people = [
      { letter: 'К', name: 'Костя', sub: '2 устройства · вы', role: 'Админ', bg: '#DCEBFF', fg: '#1A5CB8', tagBg: '#DCEBFF', tagFg: '#1A5CB8' },
      { letter: 'М', name: 'Мама', sub: '2 устройства', role: 'Доверенный', bg: '#FFE6D2', fg: '#A8480A', tagBg: '#E4F5EC', tagFg: '#146B3E' },
      { letter: 'П', name: 'Папа', sub: '1 устройство', role: 'Участник', bg: '#E5DDFA', fg: '#5430B8', tagBg: '#EEEEF1', tagFg: '#4A4D57' },
      { letter: 'С', name: 'Сестра', sub: '1 устройство · офлайн', role: 'Участник', bg: '#D9F1E4', fg: '#146B3E', tagBg: '#EEEEF1', tagFg: '#4A4D57' }
    ];
    const avatars = people.map(function (p, i) { return { letter: p.letter, bg: p.bg, fg: p.fg, ml: i === 0 ? '0' : '-10px' }; });
    const members = people.map(function (p, i) { return Object.assign({}, p, { border: i === 0 ? 'none' : '1px solid #F0F0F3' }); });
    const netrows = [
      { href: 'Network.dc.html', d: I.refresh, bg: '#E4F1FF', fg: '#1A6FDB', title: 'Адреса устройств', sub: 'Обновлены 2 минуты назад' },
      { href: 'Network.dc.html', d: I.globe, bg: '#E8F6EE', fg: '#16804A', title: 'Прямые соединения', sub: '3 из 5 устройств' },
      { href: 'Security.dc.html', d: I.key, bg: '#EFEAFB', fg: '#6038C9', title: 'Кто выдаёт ключи', sub: 'Доверенные участники' }
    ].map(function (r, i) { return Object.assign({}, r, { border: i === 0 ? 'none' : '1px solid #F0F0F3' }); });
    const nav = [
      { href: 'Main.dc.html', label: 'Главная', d: I.home },
      { href: 'Devices.dc.html', label: 'Устройства', d: I.devices },
      { href: 'Share.dc.html', label: 'Обмен', d: I.sync },
      { href: 'Family.dc.html', label: 'Семья', d: I.family },
      { href: 'Settings.dc.html', label: 'Настройки', d: I.settings }
    ].map(function (n, i) { return Object.assign({}, n, { color: i === 3 ? '#1A6FDB' : '#666A75', w: i === 3 ? '600' : '500' }); });
    return { ic: I, avatars: avatars, members: members, netrows: netrows, nav: nav };
  }
}
</script>
</body>
</html>
