<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приветствие</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;padding:64px 24px 0 24px;background:linear-gradient(180deg,#DDE8F7 0,#F1F2F6 420px);font-family:Onest,system-ui,sans-serif;color:#121316">

  <div style="display:flex;align-items:center;gap:12px;height:44px">
    <div style="width:44px;height:44px;border-radius:14px;background:#2B8CF5;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.sync}}"/></svg>
    </div>
    <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px">FamSync</div>
  </div>

  <svg width="342" height="300" viewBox="0 0 342 300" style="display:block;margin-top:16px" role="img" aria-label="Устройства семьи соединены напрямую друг с другом">
    <circle cx="171" cy="150" r="92" fill="none" stroke="#C5DBF7" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="171" cy="150" r="136" fill="none" stroke="#D5E4F8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path d="M171 150L50 60M171 150L292 60M171 150L50 240M171 150L292 240" stroke="#9CC4F5" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
    <circle cx="50" cy="60" r="34" fill="#FFFFFF" stroke="#DCE6F4" stroke-width="1.5"/>
    <circle cx="292" cy="60" r="34" fill="#FFFFFF" stroke="#DCE6F4" stroke-width="1.5"/>
    <circle cx="50" cy="240" r="34" fill="#FFFFFF" stroke="#DCE6F4" stroke-width="1.5"/>
    <circle cx="292" cy="240" r="34" fill="#FFFFFF" stroke="#DCE6F4" stroke-width="1.5"/>
    <g transform="translate(36 46) scale(1.1667)" fill="none" stroke="#1A6FDB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.phone}}"/></g>
    <g transform="translate(278 46) scale(1.1667)" fill="none" stroke="#1A6FDB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.laptop}}"/></g>
    <g transform="translate(36 226) scale(1.1667)" fill="none" stroke="#1A6FDB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.tablet}}"/></g>
    <g transform="translate(278 226) scale(1.1667)" fill="none" stroke="#1A6FDB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.mirror}}"/></g>
    <circle cx="171" cy="150" r="46" fill="#2B8CF5"/>
    <g transform="translate(150 129) scale(1.75)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.sync}}"/></g>
  </svg>

  <h1 style="margin:16px 0 0 0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">Семья на связи без облака</h1>
  <p style="margin:12px 0 0 0;font-size:16px;line-height:24px;color:#4A4D57">Буфер обмена, файлы, уведомления и экран идут напрямую между вашими устройствами.</p>

  <a href="Main.dc.html" style="margin-top:28px;height:56px;border-radius:28px;background:#1A6FDB;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">Создать семью</a>
  <a href="Pair.dc.html" style="margin-top:12px;height:56px;border-radius:28px;background:#FFFFFF;color:#121316;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.qr}}"/></svg>
    Присоединиться по QR
  </a>

  <div style="margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;line-height:18px;color:#4A4D57">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.lock}}"/></svg>
    Шифрование Noise XX. Данные не проходят через сервер.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      sync: 'M4 8h13l-3-3M20 16H7l3 3',
      phone: 'M8 3h8a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 16 21H8a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 8 3zM11 18h2',
      laptop: 'M6 5h12a2 2 0 0 1 2 2v9H4V7a2 2 0 0 1 2-2zM2 19h20',
      tablet: 'M6 3h12a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 6 3zM11 18h2',
      mirror: 'M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 17v3',
      qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3M20 14v2M14 20h3M20 20v0',
      lock: 'M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3'
    };
    return { ic: I };
  }
}
</script>
</body>
</html>
