<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обмен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#000000;font-family:Onest,system-ui,sans-serif;color:#FFFFFF">

  <div style="padding:60px 24px 0 24px;display:flex;justify-content:space-between;align-items:flex-start">
    <h1 style="margin:0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">Обмен</h1>
    <a href="Pair.dc.html" aria-label="Добавить устройство" style="width:44px;height:44px;margin-top:-2px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #FFFFFF;box-sizing:border-box;color:#FFFFFF;width:40px;height:40px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"/></svg>
    </a>
  </div>

  <div style="position:relative;width:250px;height:250px;margin:8px auto 0 auto">
    <svg width="250" height="250" viewBox="0 0 250 250" role="img" aria-label="Кольца активности: буфер обмена, файлы, уведомления">
      <g transform="rotate(-90 125 125)" fill="none" stroke-linecap="round" stroke-width="22">
        <circle cx="125" cy="125" r="108" stroke="#FF6A1F" stroke-opacity="0.18"/>
        <circle cx="125" cy="125" r="108" stroke="#FF6A1F" stroke-dasharray="475 679"/>
        <circle cx="125" cy="125" r="82" stroke="#9BEA3C" stroke-opacity="0.18"/>
        <circle cx="125" cy="125" r="82" stroke="#9BEA3C" stroke-dasharray="283 516"/>
        <circle cx="125" cy="125" r="56" stroke="#4FE3F2" stroke-opacity="0.18"/>
        <circle cx="125" cy="125" r="56" stroke="#4FE3F2" stroke-dasharray="218 352"/>
      </g>
    </svg>
    <div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:13px;line-height:18px;color:#B4B7C0">Сегодня</div>
      <div style="font-size:22px;line-height:28px;font-weight:700">184 МБ</div>
    </div>
  </div>

  <section style="margin:14px 14px 0 14px;background:#1C1C1F;border-radius:26px;padding:18px 18px 8px 18px">
    <div style="display:flex">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" style="flex:1;min-width:0;color:#FFFFFF">
          <div style="display:flex;align-items:center;gap:6px;color:{{s.color}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{s.d}}"/></svg>
            <span style="font-size:16px;line-height:22px;font-weight:600;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.label}}</span>
          </div>
          <div style="margin-top:8px;font-size:38px;line-height:44px;font-weight:600">{{s.value}}</div>
          <div style="font-size:13px;line-height:18px;color:#A9ACB6">{{s.unit}}</div>
        </a>
      </sc-for>
    </div>
    <a href="Files.dc.html" style="margin-top:14px;border-top:1px solid #34343A;height:52px;display:flex;align-items:center;justify-content:space-between;color:#FFFFFF;font-size:16px;font-weight:500">
      <span style="display:flex;align-items:center;gap:10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FE3F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.upload}}"/></svg>
        Очередь отправки (0)
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9ACB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chev}}"/></svg>
    </a>
  </section>

  <div style="margin:12px 14px 0 14px;display:flex;gap:12px">
    <section style="flex:1;min-width:0;height:176px;box-sizing:border-box;background:#1C1C1F;border-radius:26px;padding:16px;display:flex;flex-direction:column">
      <div style="width:36px;height:36px;border-radius:50%;background:#3A6BFF;display:flex;align-items:center;justify-content:center;color:#FFFFFF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.wifi}}"/></svg>
      </div>
      <div style="margin-top:10px;font-size:20px;line-height:26px;font-weight:600">Связь</div>
      <div style="font-size:14px;line-height:20px;color:#B4B7C0">Задержка 12 мс</div>
      <div style="margin-top:auto">
        <div style="position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#FF5A5A 0,#FFC247 50%,#3DDC84 100%)">
          <div style="position:absolute;left:82%;top:-3px;width:6px;height:20px;border-radius:3px;background:#FFFFFF"></div>
        </div>
        <div style="margin-top:8px;display:flex;justify-content:space-between;font-size:13px;color:#A9ACB6"><span>Плохо</span><span>Отлично</span></div>
      </div>
    </section>
    <section style="flex:1;min-width:0;height:176px;box-sizing:border-box;background:#1C1C1F;border-radius:26px;padding:16px;display:flex;flex-direction:column">
      <div style="width:36px;height:36px;border-radius:50%;background:#12A8B8;display:flex;align-items:center;justify-content:center;color:#FFFFFF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.bolt}}"/></svg>
      </div>
      <div style="margin-top:10px;font-size:20px;line-height:26px;font-weight:600">Скорость</div>
      <div style="font-size:14px;line-height:20px;color:#B4B7C0">38 Мбит/с</div>
      <div style="margin-top:auto;height:44px;display:flex;align-items:flex-end;gap:3px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
          <div style="flex:1;height:{{b.h}}px;border-radius:2px;background:{{b.c}}"></div>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Основное меню" style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 6px 22px 6px;display:flex;background:#141416;border-top:1px solid #2C2C31">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{n.color}};font-size:11px;line-height:14px;font-weight:{{n.w}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        {{n.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      plus: 'M12 5v14M5 12h14',
      chev: 'M9 6l6 6-6 6',
      upload: 'M12 16V5M7 10l5-5 5 5M5 20h14',
      wifi: 'M3 9a14 14 0 0 1 18 0M6 12.5a9.5 9.5 0 0 1 12 0M9 16a5 5 0 0 1 6 0M11 19.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0',
      bolt: 'M13 3L5 13h6l-1 8 8-10h-6z',
      clipboard: 'M8 4h8a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9.5 4V3h5v1M9 11h6M9 15h6',
      folder: 'M4 6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z',
      bell: 'M6 17v-6a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4',
      home: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',
      devices: 'M3 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9H3zM1 19h16M19 9h2a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z',
      sync: 'M4 8h13l-3-3M20 16H7l3 3',
      family: 'M6 8a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.7 6.2a2.6 2.6 0 0 1 0 5.2M17 14.2c2.4.6 4 2.6 4 5.3',
      settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
    };
    const stats = [
      { href: 'Clipboard.dc.html', d: I.clipboard, color: '#FF6A1F', label: 'Буфер', value: '42', unit: '/ копирований' },
      { href: 'Files.dc.html', d: I.folder, color: '#9BEA3C', label: 'Файлы', value: '7', unit: '/ файлов' },
      { href: 'Notifs.dc.html', d: I.bell, color: '#4FE3F2', label: 'Уведомления', value: '63', unit: '/ шт.' }
    ];
    const hs = [10, 14, 22, 18, 30, 26, 16, 12, 24, 34, 40, 28, 20, 14, 26, 36, 30, 18];
    const bars = hs.map(function (h, i) { return { h: h, c: i > 12 ? '#4FE3F2' : '#2C7F89' }; });
    const nav = [
      { href: 'Main.dc.html', label: 'Главная', d: I.home },
      { href: 'Devices.dc.html', label: 'Устройства', d: I.devices },
      { href: 'Share.dc.html', label: 'Обмен', d: I.sync },
      { href: 'Family.dc.html', label: 'Семья', d: I.family },
      { href: 'Settings.dc.html', label: 'Настройки', d: I.settings }
    ].map(function (n, i) { return Object.assign({}, n, { color: i === 2 ? '#6DB2FF' : '#A7AAB4', w: i === 2 ? '600' : '500' }); });
    return { ic: I, stats: stats, bars: bars, nav: nav };
  }
}
</script>
</body>
</html>
