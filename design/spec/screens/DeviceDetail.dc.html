<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка устройства</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:1100px;position:relative;overflow:hidden;box-sizing:border-box;background:linear-gradient(180deg,#E3EAF4 0,#F1F2F6 360px);font-family:Onest,system-ui,sans-serif;color:#121316">

  <div style="padding:56px 12px 0 12px;display:flex;justify-content:space-between">
    <a href="Devices.dc.html" aria-label="Назад" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#121316">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.back}}"/></svg>
    </a>
    <button type="button" aria-label="Ещё" style="width:44px;height:44px;border:0;background:transparent;color:#121316;padding:0;display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.more}}"/></svg>
    </button>
  </div>
  <h1 style="margin:4px 24px 0 24px;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-0.5px">Ноутбук Linux</h1>
  <div style="margin:4px 24px 0 24px;display:flex;align-items:center;gap:8px;font-size:16px;line-height:22px;color:#4A4D57">
    <span style="width:9px;height:9px;border-radius:50%;background:#2BB673"></span>В сети · LAN · 12 мс
  </div>

  <section style="margin:20px 16px 0 16px;background:#FFFFFF;border-radius:28px;padding:20px 12px;box-shadow:0 1px 2px rgba(20,30,50,0.04)">
    <div style="display:flex;align-items:center;gap:14px;padding:0 8px">
      <div style="width:64px;height:64px;border-radius:18px;background:#EAF3FF;color:#1A6FDB;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.laptop}}"/></svg>
      </div>
      <div style="min-width:0">
        <div style="font-size:20px;line-height:26px;font-weight:600">Что передавать</div>
        <div style="margin-top:2px;font-size:14px;line-height:20px;color:#666A75">Для этого устройства</div>
      </div>
    </div>
    <div style="display:flex;margin-top:22px">
      <sc-for list="{{features}}" as="f" hint-placeholder-count="4">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px">
          <button type="button" role="switch" aria-checked="{{f.on}}" aria-label="{{f.label}}" onClick="{{f.toggle}}" style="width:60px;height:60px;border-radius:50%;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:{{f.bg}};color:{{f.fg}}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.d}}"/></svg>
          </button>
          <div style="font-size:13px;line-height:18px;letter-spacing:-0.2px;font-weight:{{f.w}}">{{f.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;gap:12px;margin-top:22px">
      <a href="Files.dc.html" style="flex:1;height:56px;border-radius:28px;background:#1A6FDB;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.upload}}"/></svg>
        Отправить файл
      </a>
      <a href="Mirror.dc.html" style="flex:1;height:56px;border-radius:28px;background:#EEEEF1;color:#121316;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.mirror}}"/></svg>
        Зеркало
      </a>
    </div>
  </section>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="margin:20px 16px 0 16px">
      <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
        <div style="padding:0 8px 8px 8px;font-size:13px;line-height:17px;font-weight:500;color:#666A75">{{g.title}}</div>
      </sc-if>
      <div style="background:#FFFFFF;border-radius:24px;overflow:hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:56px;box-sizing:border-box;border-top:{{r.border}}">
            <div style="flex:1;min-width:0;font-size:16px;line-height:22px;font-weight:500;color:{{r.titleColor}}">{{r.title}}</div>
            <sc-if value="{{r.value}}" hint-placeholder-val="{{true}}">
              <div style="font-size:14px;line-height:20px;color:#666A75">{{r.value}}</div>
            </sc-if>
            <sc-if value="{{r.nav}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ic.chev}}"/></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: { clip: true, files: true, notif: true, mirror: false } };
  }
  renderVals() {
    const I = {
      back: 'M15 6l-6 6 6 6',
      chev: 'M9 6l6 6-6 6',
      more: 'M5 12h.01M12 12h.01M19 12h.01',
      laptop: 'M6 5h12a2 2 0 0 1 2 2v9H4V7a2 2 0 0 1 2-2zM2 19h20',
      upload: 'M12 16V5M7 10l5-5 5 5M5 20h14',
      mirror: 'M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 17v3',
      clipboard: 'M8 4h8a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9.5 4V3h5v1M9 11h6M9 15h6',
      folder: 'M4 6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z',
      bell: 'M6 17v-6a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4'
    };
    const self = this;
    const t = this.state.t;
    const features = [
      { id: 'clip', label: 'Буфер', d: I.clipboard },
      { id: 'files', label: 'Файлы', d: I.folder },
      { id: 'notif', label: 'Уведомления', d: I.bell },
      { id: 'mirror', label: 'Зеркало', d: I.mirror }
    ].map(function (f) {
      const on = !!t[f.id];
      return {
        label: f.label, d: f.d, on: on,
        bg: on ? '#2B8CF5' : '#EDEDF0', fg: on ? '#FFFFFF' : '#121316', w: on ? '600' : '400',
        toggle: function () { const n = Object.assign({}, self.state.t); n[f.id] = !n[f.id]; self.setState({ t: n }); }
      };
    });
    const raw = [
      { title: 'О устройстве', rows: [
        { title: 'Платформа', value: 'Linux · KDE Plasma' },
        { title: 'Подключение', value: 'LAN · напрямую' },
        { title: 'Версия ядра', value: '0.1.0' },
        { title: 'Отпечаток ключа', value: '7C1D…E40A' },
        { title: 'Доверие', value: 'Доверенное', nav: true }
      ] },
      { title: 'Управление', rows: [
        { title: 'Переименовать', nav: true },
        { title: 'Приоритет передачи', value: 'Обычный', nav: true },
        { title: 'Забыть устройство', danger: true }
      ] }
    ];
    const groups = raw.map(function (g) {
      return { title: g.title, rows: g.rows.map(function (r, i) {
        return { title: r.title, value: r.value || '', nav: !!r.nav, titleColor: r.danger ? '#C42B2B' : '#121316', border: i === 0 ? 'none' : '1px solid #F0F0F3' };
      }) };
    });
    return { ic: I, features: features, groups: groups };
  }
}
</script>
</body>
</html>
