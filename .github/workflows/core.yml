name: Ядро

# Сборка и тесты ядра. Только Linux: раннеры бесплатные и не требуют
# установки Visual Studio, а ядро кроссплатформенное по определению (D-001).
# Кросс-компиляция под Android проверяется отдельным заданием.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Новый пуш отменяет предыдущий: незачем ждать, пока досидит устаревший.
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable

      # protoc обязателен: prost-build генерирует типы из схемы.
      # На раннере он есть, но полагаться на это нельзя — версия может уехать.
      - name: protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29'

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Форматирование
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Тесты
        run: cargo test --all-features -- --nocapture

      - name: Сборка в release
        # release-профиль проверяется отдельно: там снят panic = abort (D-008),
        # и ошибка в unwind-настройках видна только на этой сборке.
        run: cargo build --release

  cross:
    name: Кросс-компиляция под Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - uses: arduino/setup-protoc@v3
        with:
          version: '29'

      # Android NDK нужен для линкеров: без него кросс-сборка падает на поиске
      # aarch64-linux-android-clang.
      - name: Установка NDK
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          mkdir -p "${ANDROID_NDK_ROOT}"
          mv /tmp/android-ndk-r27c "${ANDROID_NDK_ROOT}/27.3.13750724"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}/27.3.13750724" >> "$GITHUB_ENV"

      # Ядро собирается под четыре ABI: клиент отдаётся универсальным APK.
      #
      # transport-ice здесь выключен намеренно: он тянет `stun`, а тот —
      # `nix`, который не собирается под Android. Для связи через интернет на
      # телефоне нужен другой клиент STUN; это отмечено в STATUS.md и в
      # плане, а не спрятано отключением проверки.
      - name: Проверка всех ABI
        run: |
          set -euo pipefail
          bin="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ar="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$bin/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$bin/i686-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android21-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android21-clang"
          export CC_armv7_linux_androideabi="$bin/armv7a-linux-androideabi21-clang"
          export CC_i686_linux_android="$bin/i686-linux-android21-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android21-clang"
          # cc-rs смотрит переменные вида AR_<цель>, а не общую AR.
          export AR_aarch64_linux_android="$ar"
          export AR_armv7_linux_androideabi="$ar"
          export AR_i686_linux_android="$ar"
          export AR_x86_64_linux_android="$ar"

          features=transport-lan,transport-ble,transport-usb,transport-softap
          for target in \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android; do
            echo "=== $target ==="
            cargo build --target "$target" --no-default-features --features "$features"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-cross