name: Android APK

# Отладочная сборка Android-клиента.
#
# Собирается только здесь, локально не требуется: на машине владельца нет
# Android Studio с нужным набором SDK, а лишние сборки на слабом ноутбуке
# съедают время. Готовый APK кладётся в релиз на GitHub.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Имя релиза. Пусто — без публикации, только артефакт сборки'
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

# Публикация релиза идёт токеном пайплайна, а не токеном владельца: иначе
# публикация падала бы с «Resource not accessible by integration».
permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    env:
      TAG_INPUT: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная глубина нужна ради тегов: версия приложения читается из
          # `git describe --tags`, а в неглубоком клоне тегов нет, и сборка
          # показала бы пользователю «0.0.0-локальная» вместо настоящей версии.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # cmdline-tools ставится напрямую, без экшена setup-android.
      #
      # Причины: setup-android ищет пакет `tools`, которого больше нет в
      # репозитории SDK, а его приём лицензий тянет превью-сборку и падает.
      # Прямая установка с закреплённой версией детерминированнее.
      - name: Установка cmdline-tools
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -sSL -o /tmp/tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" \
             "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Приём лицензий и установка пакетов
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('client-android/**/*.kt', 'client-android/**/*.toml') }}
          restore-keys: gradle-

      # Ядро собирается отдельно и кладётся в jniLibs. Собирать его внутри
      # Gradle нельзя: тот же исходник уходит в Windows и Linux-сборки, и
      # лишняя сборка внутри Android сломала бы разделение сред (D-012).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - uses: arduino/setup-protoc@v3
        with:
          version: '29'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apk

      - name: Сборка ядра под все ABI
        working-directory: core
        run: |
          ndk_dir="$ANDROID_NDK_ROOT"
          if [ -z "$ndk_dir" ]; then
            ndk_dir=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | tail -1)
          fi
          if [ -z "$ndk_dir" ]; then
            sdkmanager "ndk;27.2.12479018"
            ndk_dir="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "NDK=$ndk_dir" >> "$GITHUB_ENV"
          export NDK="$ndk_dir"

          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ar="$bin/llvm-ar"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android21-clang"
          export CC_armv7_linux_androideabi="$bin/armv7a-linux-androideabi21-clang"
          export CC_i686_linux_android="$bin/i686-linux-android21-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CC_armv7_linux_androideabi"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$CC_i686_linux_android"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CC_x86_64_linux_android"
          # cc-rs смотрит переменные вида AR_<цель>, а не общую AR.
          export AR_aarch64_linux_android="$ar"
          export AR_armv7_linux_androideabi="$ar"
          export AR_i686_linux_android="$ar"
          export AR_x86_64_linux_android="$ar"

          # transport-ice выключен: он тянет `stun`, а тот — `nix`,
          # который под Android не собирается. На десктопных клиентах ICE
          # остаётся включённым по умолчанию.
          features=transport-lan,transport-ble,transport-usb,transport-softap
          for target in \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android; do
            cargo build --release --target "$target" \
              --no-default-features --features "$features"
          done

          out="../client-android/app/src/main/jniLibs"
          mkdir -p "$out"
          copy() {
            mkdir -p "$out/$1"
            cp "target/$2/release/libbraidwork_core.so" "$out/$1/"
          }
          copy arm64-v8a    aarch64-linux-android
          copy armeabi-v7a  armv7-linux-androideabi
          copy x86         i686-linux-android
          copy x86_64      x86_64-linux-android

          ls -laR "$out"

      # The header is hand-written and only Rust is compiled here, so nothing
      # would catch a typo in a prototype or a function that exists in the
      # library but was never declared. That failure mode is nasty: the app
      # builds, installs and only then dies with UnsatisfiedLinkError on a
      # phone. Comparing the two lists takes a second and catches it here.
      - name: Сверка заголовка с библиотекой
        working-directory: core
        run: |
          set -euo pipefail
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          so="target/aarch64-linux-android/debug/libbraidwork_core.so"
          if [ ! -f "$so" ]; then
            so="target/aarch64-linux-android/release/libbraidwork_core.so"
          fi

          # Declared in braidwork_core.h, defined in the library.
          # The fl_ prefix is required: the library also exports JNI entry
          # points (declared in Kotlin, not here) and whatever the Rust
          # dependencies leave behind.
          "$bin/llvm-nm" -D --defined-only "$so" \
            | awk '$2 == "T" && $3 ~ /^fl_/ { print $3 }' | sort -u > /tmp/in_lib.txt

          grep -oE '\bfl_[a-z0-9_]+[[:space:]]*\(' include/braidwork_core.h \
            | sed 's/[[:space:]]*($//; s/($//; s/[[:space:]]*(//' \
            | sort -u > /tmp/in_header.txt

          echo "--- in header, missing from library ---"
          comm -23 /tmp/in_header.txt /tmp/in_lib.txt | tee /tmp/only_header.txt || true

          echo "--- in library, not declared in header ---"
          comm -13 /tmp/in_header.txt /tmp/in_lib.txt | tee /tmp/only_lib.txt || true

          if [ -s /tmp/only_header.txt ] || [ -s /tmp/only_lib.txt ]; then
            echo ""
            echo "The header and the library disagree. Both lists must match:"
            echo "  the header is the contract and is edited by hand;"
            echo "  a function declared but not exported would fail on a phone."
            exit 1
          fi

          echo "OK: $(wc -l < /tmp/in_header.txt) functions, header and library agree."

      - name: Сборка APK
        working-directory: client-android
        run: |
          # gradlew приходит из репозитория без исполняющего бита: на Windows
          # он и не нужен, а на раннере это Permission denied.
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Загрузка артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: braidwork-debug-apk
          path: client-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Релиз создаётся только если задан тег. Обычный запуск пайплайна
      # оставляет APK в артефактах сборки и не засоряет список релизов.
      - name: Публикация в релиз
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: client-android/app/build/outputs/apk/debug/*.apk
          body: |
            Отладочная сборка.

            Интерфейс переведён из спецификации дизайна целиком: 5 разделов
            и 13 подэкранов, плюс разовый экран приветствия.

            Транспорта ещё нет: устройства не находят друг друга. Поэтому на
            экранах честные нули и пустые списки, а не выдуманные данные.

            Подпись debug: обновление поверх ранее установленной версии
            сработает, пока ключ тот же. Он же меняется при каждом запуске
            пайплайна, поэтому перед установкой стараю версия удаляется.

            Для стабильных версий нужна собственная подпись.