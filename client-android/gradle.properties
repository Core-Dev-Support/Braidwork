# Свойства сборки клиента Android.

# Проект использует AndroidX целиком. Без этого флага сборка падает на
# проверке метаданных, как только в зависимостях появляется AndroidX.
android.useAndroidX=true

# Замена устаревших библиотек поддержки на AndroidX. Само по себе не требуется,
# но включено вместе с useAndroidX, чтобы Jetpack-зависимости вели себя
# предсказуемо.
android.enableJetifier=false

# Сборка для всех указанных ABI: клиент отдаётся универсальным APK.
android.nonTransitiveRClass=true

# Лимит памяти Gradle. На слабых машинах значение по умолчанию иногда
# приводит к падению демона сборки на этапе линковки.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Без этого каждая сборка пытается поднять демон Gradle.
org.gradle.daemon=false

# Параллельная сборка модулей. В проекте один модуль, но на общих пайплайнах
# лишний поток только мешает.
org.gradle.parallel=false

# Кэш сборок между прогонами на CI.
org.gradle.caching=true
org.gradle.configureondemand=false